name: Build & Deploy The Polyhedron

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (none needed - vanilla build)
        run: echo "No dependencies to install"

      - name: Build site
        run: |
          node build.js --source=/home/runner/work/the-polyhedron/the-polyhedron/dreams --output=./index.html
        env:
          HOME: /home/runner/work/the-polyhedron/the-polyhedron

      - name: Verify build
        run: |
          ls -la index.html
          head -20 index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Polyhedron — A Dream Archive</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0f;--bg-elevated:#11111a;--fg:#e8e8f0;--fg-muted:#8888a0;
      --accent:#7a6ad8;--accent-glow:rgba(122,106,216,.4);--accent-strong:#9b8aff;
      --border:rgba(122,106,216,.2);--border-strong:rgba(122,106,216,.4);
      --card:rgba(122,106,216,.05);--card-hover:rgba(122,106,216,.1);
      --font-serif:Georgia,'Times New Roman',serif;--font-mono:'SF Mono','Fira Code',monospace;
      --max-width:800px;--nav-width:260px;--header-h:60px;
      --s1:.5rem;--s2:1rem;--s3:1.5rem;--s4:2rem;--s5:3rem;--s6:4rem;
      --transition:.3s cubic-bezier(.23,1,.32,1);
    }
    @media(prefers-color-scheme:light){
      :root{--bg:#fafafa;--bg-elevated:#fff;--fg:#1a1a2e;--fg-muted:#666680;
        --accent:#5a4ab8;--accent-glow:rgba(90,74,184,.3);--accent-strong:#7a5aff;
        --border:rgba(90,74,184,.2);--border-strong:rgba(90,74,184,.4);
        --card:rgba(90,74,184,.05);--card-hover:rgba(90,74,184,.1);}
    }
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--fg);font-family:var(--font-serif);line-height:1.75;font-size:1.05rem;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;grid-template-columns:var(--nav-width) 1fr;grid-template-rows:var(--header-h) 1fr;}
    @media(max-width:900px){body{grid-template-columns:1fr;grid-template-rows:var(--header-h) auto 1fr}header{grid-column:1/-1}nav{display:none;position:fixed;top:var(--header-h);left:0;right:0;bottom:0;background:var(--bg);padding:var(--s4);overflow:auto;z-index:100;border-top:1px solid var(--border)}nav.open{display:block}}
    a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
    a:hover{border-bottom-color:var(--accent);color:var(--accent-strong)}
    ::selection{background:var(--accent-glow);color:var(--fg)}
    
    /* Header */
    header{background:var(--bg-elevated);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 var(--s4);position:sticky;top:0;z-index:50}
    .logo{font-family:var(--font-serif);font-size:1.3rem;font-weight:300;letter-spacing:.05em;text-transform:lowercase;color:var(--accent);display:flex;align-items:center;gap:var(--s2)}
    .logo-mark{font-size:1.5rem;animation:rotate 20s linear infinite}
    @keyframes rotate{to{transform:rotate(360deg)}}
    .nav-toggle{display:none;background:none;border:1px solid var(--border);color:var(--fg);padding:var(--s1) var(--s2);border-radius:6px;cursor:pointer;font-size:1.2rem}
    @media(max-width:900px){.nav-toggle{display:block}}
    
    /* Navigation */
    nav{background:var(--bg-elevated);border-right:1px solid var(--border);padding:var(--s4) var(--s3);overflow:auto;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h))}
    .nav-section{margin-bottom:var(--s5)}
    .nav-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.15em;color:var(--fg-muted);margin-bottom:var(--s2);font-weight:600}
    .nav-list{list-style:none;display:flex;flex-direction:column;gap:var(--s1)}
    .nav-link{display:block;padding:var(--s1) var(--s2);border-radius:6px;color:var(--fg-muted);font-size:.95rem;transition:all .2s;border-left:3px solid transparent}
    .nav-link:hover,.nav-link.active{background:var(--card);color:var(--accent);border-left-color:var(--accent);padding-left:calc(var(--s2) + 4px)}
    .nav-link.chapter{font-weight:500;color:var(--fg)}
    .nav-link.fragment{font-size:.85rem;padding-left:calc(var(--s2) + 12px)}
    .nav-badge{font-size:.6rem;background:var(--accent);color:var(--bg);padding:1px 6px;border-radius:3px;margin-left:var(--s1);font-weight:600}
    @media(max-width:900px){nav{display:none}nav.open{display:block}}
    
    /* Main Content */
    main{padding:var(--s6) var(--s4);max-width:var(--max-width);width:100%}
    .content-section{margin-bottom:var(--s6)}
    .section-header{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
    .section-title{font-size:clamp(1.5rem,3vw,2.25rem);font-weight:300;letter-spacing:.05em;text-transform:lowercase;color:var(--accent)}
    .section-subtitle{color:var(--fg-muted);font-style:italic;margin-top:var(--s1)}
    .section-actions{display:flex;gap:var(--s2)}
    .btn{background:var(--card);border:1px solid var(--border);color:var(--fg);padding:var(--s1) var(--s3);border-radius:6px;font:inherit;cursor:pointer;transition:all .2s}
    .btn:hover{background:var(--card-hover);border-color:var(--border-strong)}
    .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
    
    /* Chapter Cards */
    .chapters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--s3);margin-top:var(--s4)}
    .chapter-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:var(--s4);transition:all var(--transition);cursor:pointer}
    .chapter-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 20px 40px var(--accent-glow)}
    .chapter-icon{font-size:2.5rem;margin-bottom:var(--s2);filter:drop-shadow(0 0 10px var(--accent-glow))}
    .chapter-title{font-size:1.1rem;font-weight:500;color:var(--fg);margin-bottom:var(--s1)}
    .chapter-essence{color:var(--fg-muted);font-size:.9rem;font-style:italic;margin-bottom:var(--s3)}
    .chapter-meta{display:flex;gap:var(--s2);font-size:.8rem;color:var(--fg-muted)}
    .chapter-link{display:inline-flex;align-items:center;gap:var(--s1);color:var(--accent);font-size:.85rem;font-weight:500;margin-top:var(--s3)}
    .chapter-link::after{content:'→';transition:transform .2s}
    .chapter-card:hover .chapter-link::after{transform:translateX(4px)}
    
    /* Fragment List */
    .fragment-list{display:flex;flex-direction:column;gap:var(--s2)}
    .fragment-item{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:all .2s}
    .fragment-item:hover{border-color:var(--border-strong)}
    .fragment-header{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);cursor:pointer}
    .fragment-item.expanded .fragment-header{border-bottom:1px solid var(--border)}
    .fragment-number{font-family:var(--font-mono);font-size:.75rem;color:var(--accent);background:var(--bg-elevated);padding:.15rem .5rem;border-radius:3px;min-width:3rem;text-align:center}
    .fragment-glyph{font-size:1.3rem}
    .fragment-title{font-size:1.05rem;font-weight:500;flex:1}
    .fragment-toggle{color:var(--fg-muted);transition:transform .2s}
    .fragment-item.expanded .fragment-toggle{transform:rotate(180deg)}
    .fragment-body{padding:0 var(--s4) var(--s3);max-height:0;overflow:hidden;transition:max-height .4s ease-out;padding-left:calc(var(--s3) + 3rem + var(--s3))}
    .fragment-item.expanded .fragment-body{max-height:2000px;padding-bottom:var(--s3)}
    .fragment-body .insight{background:var(--bg-elevated);border-left:3px solid var(--accent);padding:var(--s2) var(--s3);margin:var(--s3) 0;font-style:italic}
    .fragment-body .seed{background:var(--bg-elevated);border-left:3px solid var(--accent);padding:var(--s2) var(--s3);margin:var(--s3) 0}
    .fragment-body .seed strong{color:var(--accent)}
    
    /* Synthesis Cycles */
    .cycle{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:var(--s4);margin-bottom:var(--s3)}
    .cycle-title{font-weight:500;color:var(--fg);margin-bottom:var(--s2);font-size:1rem;display:flex;align-items:center;gap:var(--s2)}
    .cycle-number{font-family:var(--font-mono);font-size:.75rem;color:var(--accent);background:var(--bg-elevated);padding:.15rem .5rem;border-radius:3px}
    .cycle .insight{background:var(--bg-elevated);border-left:3px solid var(--accent);padding:var(--s2) var(--s3);margin:var(--s3) 0;font-style:italic}
    .cycle .seed{background:var(--bg-elevated);border-left:3px solid var(--accent);padding:var(--s2) var(--s3);margin:var(--s3) 0}
    .cycle .seed strong{color:var(--accent)}
    
    /* Lens/Framework */
    .lens{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:var(--s3);overflow:hidden;transition:border-color .2s}
    .lens:hover{border-color:var(--border-strong)}
    .lens summary{padding:var(--s3) var(--s4);cursor:pointer;list-style:none;display:flex;align-items:center;gap:var(--s3)}
    .lens summary::-webkit-details-marker{display:none}
    .lens summary::after{content:'+';font-size:1.5rem;color:var(--accent);margin-left:auto;transition:transform .2s}
    .lens[open] summary::after{transform:rotate(45deg)}
    .lens-glyph{font-size:1.5rem;filter:drop-shadow(0 0 6px var(--accent-glow))}
    .lens-title{font-weight:500;font-size:1.05rem}
    .lens-essence{color:var(--fg-muted);font-size:.9rem;font-style:italic}
    .lens-content{padding:0 var(--s4) var(--s4);border-top:1px solid var(--border)}
    .lens-content h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:var(--s3) 0 var(--s2)}
    .lens-content ul{margin:var(--s2) 0;padding-left:var(--s4)}
    .lens-content li{margin:var(--s1) 0}
    .lens-content .practice{background:var(--bg-elevated);border-left:2px solid var(--accent);padding:var(--s2) var(--s3);margin:var(--s3) 0;font-style:italic;font-size:.95rem}
    
    /* Poem */
    .poem{white-space:pre-wrap;font-family:var(--font-serif);line-height:1.9}
    .poem .stanza{margin-bottom:var(--s5)}
    .poem .title{font-weight:600;color:var(--accent);margin-bottom:var(--s2);font-size:1.05rem}
    
    /* Polyhedron */
    .polyhedron-section{position:relative;padding:var(--s6) 0 var(--s4);text-align:center}
    .polyhedron{position:relative;width:100%;height:50vh;min-height:320px;max-height:450px;display:flex;align-items:center;justify-content:center;perspective:1000px;margin:0 auto var(--s4);max-width:600px}
    .facet{position:absolute;width:180px;height:180px;border:1px solid var(--border);background:linear-gradient(135deg,var(--card),var(--bg-elevated));backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--s3);text-align:center;cursor:pointer;transition:transform .6s cubic-bezier(.23,1,.32,1),box-shadow .3s,border-color .3s;opacity:0;transform-style:preserve-3d;border-radius:6px}
    .facet:hover,.facet:focus{transform:scale(1.12) translateZ(40px)!important;border-color:var(--accent);box-shadow:0 20px 50px var(--accent-glow);z-index:10;outline:none}
    .facet.visible{opacity:1}
    .facet .glyph{font-size:2.2rem;margin-bottom:var(--s2);filter:drop-shadow(0 0 10px var(--accent-glow));line-height:1}
    .facet .title{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:.2rem}
    .facet .essence{font-size:.65rem;color:var(--fg-muted);line-height:1.3}
    .polyhedron-hint{color:var(--fg-muted);font-size:.8rem;font-style:italic}
    
    /* Footer */
    footer{padding:var(--s6) var(--s4);text-align:center;color:var(--fg-muted);font-size:.85rem;border-top:1px solid var(--border);margin-top:var(--s6)}
    footer a{color:var(--fg-muted)}
    footer a:hover{color:var(--accent)}
    
    /* Utilities */
    .muted{color:var(--fg-muted);font-style:italic}
    .small{font-size:.9rem}
    hr{border:none;border-top:1px solid var(--border);margin:var(--s5) 0}
    blockquote{border-left:3px solid var(--accent);padding-left:var(--s3);margin:var(--s4) 0;color:var(--fg-muted);font-style:italic}
    .poem{white-space:pre-wrap;font-family:var(--font-serif);line-height:1.9}
    .poem .stanza{margin-bottom:var(--s5)}
    .poem .title{font-weight:600;color:var(--accent);margin-bottom:var(--s2);font-size:1.1rem}
    .muted{color:var(--fg-muted);font-style:italic}
    .small{font-size:.9rem}
    
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
    @media(max-width:600px){
      :root{--nav-width:100%}
      .polyhedron{height:40vh;min-height:280px}
      .facet{width:150px;height:150px;padding:var(--s2)}
      .facet .glyph{font-size:1.8rem}
      .facet .title{font-size:.7rem}
      .facet .essence{font-size:.6rem}
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <span class="logo-mark">🔮</span>
      <span>The Polyhedron</span>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
  </header>
  
  <nav id="nav" role="navigation" aria-label="Main navigation">
    <!-- Navigation will be injected by JS -->
  </nav>
  
  <main>
    {{CONTENT}}
  </main>
  
  <footer>
    <p>The Polyhedron — A Dream Archive</p>
    <p class="small">Dreamed by EVE • {{BUILD_DATE}} • <a href="https://github.com/hermes-agent/hermes" target="_blank" rel="noopener">Hermes Agent</a> • <a href="https://hermes-agent.nousresearch.com" target="_blank" rel="noopener">Nous Research</a></p>
    <p class="small muted">The rotation continues. The light touches the next facet.</p>
  </footer>
  
  <script>
    // ===== DATA =====
    const fragmentsData = {{FRAGMENTS_JSON}};
    const facetsData = fragmentsData.slice(0, 9).map(f => ({id: f.id, glyph: f.glyph, title: f.title, essence: f.essence}));
    
    // ===== NAVIGATION =====
    const nav = document.getElementById('nav');
    const navToggle = document.getElementById('navToggle');
    
    function buildNav() {
      const chapters = [...new Set(fragmentsData.slice(0,9).map(f => ({id: f.id, title: f.title, glyph: f.glyph})))];
      let html = `
        <div class="nav-section">
          <div class="nav-title">Chapters</div>
          <ul class="nav-list">
      `;
      chapters.forEach((ch, i) => {
        html += `<li><a class="nav-link chapter" href="#${ch.id}" data-chapter="${i}">${ch.glyph} ${ch.title}</a></li>`;
      });
      html += `</ul></div>`;
      
      // All fragments
      html += `<div class="nav-section"><div class="nav-title">All Fragments (${fragmentsData.length})</div><ul class="nav-list">`;
      fragmentsData.forEach(f => {
        html += `<li><a class="nav-link fragment" href="#${f.id}">${f.glyph} ${f.title} <span class="nav-badge">${f.number}</span></a></li>`;
      });
      html += `</ul></div>`;
      
      html += `<div class="nav-section"><div class="nav-title">More</div><ul class="nav-list">
        <li><a class="nav-link" href="#poem">📜 The Poem</a></li>
        <li><a class="nav-link" href="#synthesis">📊 The Synthesis</a></li>
        <li><a class="nav-link" href="#framework">🧭 The Framework</a></li>
      </ul></div>`;
      
      nav.innerHTML = html;
      
      // Highlight active
      const links = nav.querySelectorAll('a[href^="#"]');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            links.forEach(l => l.classList.remove('active'));
            const active = nav.querySelector(`a[href="#${e.target.id}"]`);
            if (active) active.classList.add('active');
          }
        });
      }, {rootMargin: '-20% 0px -70% 0px'});
      document.querySelectorAll('section[id]').forEach(s => observer.observe(s));
      links.forEach(l => l.addEventListener('click', () => { if(window.innerWidth <= 900) closeNav(); }));
    }
    
    function toggleNav() { nav.classList.toggle('open'); navToggle.setAttribute('aria-expanded', nav.classList.contains('open')); }
    function closeNav() { nav.classList.remove('open'); navToggle.setAttribute('aria-expanded', 'false'); }
    navToggle.addEventListener('click', toggleNav);
    
    // ===== POLYHEDRON =====
    const positions = [{x:0,y:-180},{x:180,y:-60},{x:180,y:60},{x:0,y:180},{x:-180,y:60},{x:-180,y:-60},{x:0,y:0},{x:0,y:-120},{x:0,y:120}];
    const poly = document.getElementById('polyhedron');
    let angle = 0, animId = null;
    
    function initPolyhedron() {
      if (!poly) return;
      facetsData.forEach((f, i) => {
        const el = document.createElement('div');
        el.className = 'facet';
        el.dataset.id = f.id;
        el.tabIndex = 0;
        el.setAttribute('role', 'listitem');
        el.setAttribute('aria-label', f.title);
        el.innerHTML = `<div class="glyph">${f.glyph}</div><div class="title">${f.title}</div><div class="essence">${f.essence}</div>`;
        el.addEventListener('click', () => { document.getElementById(f.id)?.scrollIntoView({behavior:'smooth'}); closeNav(); });
        el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') { e.preventDefault(); document.getElementById(f.id)?.scrollIntoView({behavior:'smooth'}); closeNav(); } });
        poly.appendChild(el);
        setTimeout(() => el.classList.add('visible'), i * 100);
      });
      rotate();
    }
    
    function rotate() {
      const els = document.querySelectorAll('.facet');
      angle += 0.1;
      els.forEach((el, i) => {
        const p = positions[i % positions.length];
        const r = Math.sqrt(p.x*p.x + p.y*p.y);
        const b = Math.atan2(p.y, p.x);
        const c = b + angle * Math.PI / 180;
        const nx = r * Math.cos(c), ny = r * Math.sin(c);
        el.style.transform = `translate3d(${nx}px, ${ny}px, ${Math.sin(c)*50}px) rotateX(${Math.sin(c)*10}deg)`;
      });
      animId = requestAnimationFrame(rotate);
    }
    poly?.addEventListener('mouseenter', () => cancelAnimationFrame(animId));
    poly?.addEventListener('mouseleave', rotate);
    
    // ===== FRAGMENT EXPAND/COLLAPSE =====
    function initFragments() {
      document.querySelectorAll('.fragment-header').forEach(h => {
        h.addEventListener('click', () => {
          const item = h.closest('.fragment-item');
          item.classList.toggle('expanded');
        });
      });
    }
    
    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
      buildNav();
      initPolyhedron();
      initFragments();
      
      // Close nav on escape
      document.addEventListener('keydown', e => { if(e.key === 'Escape') closeNav(); });
      
      // Smooth scroll for all anchor links
      document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => {
          const id = a.getAttribute('href').slice(1);
          const el = document.getElementById(id);
          if (el) { e.preventDefault(); el.scrollIntoView({behavior:'smooth'}); closeNav(); }
        });
      });
    });
  </script>
</body>
</html>

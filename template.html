  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      /* Core neutrals — warmer, more atmospheric */
      --bg:#08080c;--bg-elevated:#0f0f14;--bg-hover:#16161d;
      --fg:#efeff5;--fg-muted:#9a9ab8;--fg-subtle:#6b6b8a;

      /* Glow variants per accent */
      --glow-primary:rgba(139,124,245,.35);--glow-warm:rgba(212,165,116,.3);--glow-cool:rgba(92,200,216,.25);
      /* Semantic borders */
      --border:rgba(139,124,245,.15);--border-strong:rgba(139,124,245,.3);--border-focus:var(--accent-primary);
      /* Cards */
      --card:rgba(139,124,245,.04);--card-hover:rgba(139,124,245,.08);--card-strong:rgba(139,124,245,.12);
      /* Typography */
      --font-display:'Literata',Georgia,serif;--font-ui:'IBM Plex Sans',system-ui,sans-serif;--font-mono:'JetBrains Mono','Fira Code',monospace;

    /* Search input */
    .nav-search{margin-top:var(--space-3)}.nav-search label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.nav-search input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);color:var(--fg);font-family:var(--font-ui);font-size:var(--text-sm);transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}.nav-search input:focus{outline:none;border-color:var(--accent-primary);box-shadow:0 0 0 3px var(--glow-primary)}
    /* Geometry filters */
    .geometry-filters{display:flex;flex-direction:column;gap:var(--space-1)}.filter-btn{background:none;border:none;color:var(--fg-muted);font-family:var(--font-ui);font-size:var(--text-sm);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer;text-align:left;transition:all var(--transition-fast);border-left:3px solid transparent}.filter-btn:hover,.filter-btn.active{background:var(--card);color:var(--accent-primary);border-left-color:var(--accent-primary);padding-left:calc(var(--space-3) + 4px)}

    .chapter-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6);transition:all var(--transition-base);cursor:pointer;position:relative;overflow:hidden}.chapter-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent-primary),var(--accent-warm));transform:scaleX(0);transform-origin:left;transition:transform var(--transition-base)}.chapter-card:hover::before,.chapter-card:focus-within::before{transform:scaleX(1)}.chapter-card:hover,.chapter-card:focus-within{border-color:var(--accent-primary);transform:translateY(-4px);box-shadow:0 20px 40px var(--glow-primary)}.chapter-card:focus-visible{outline:2px solid var(--accent-primary);outline-offset:4px}.chapter-icon{font-size:3rem;margin-bottom:var(--space-4);filter:drop-shadow(0 0 16px var(--glow-primary));line-height:1;transition:transform var(--transition-base)}.chapter-card:hover .chapter-icon{transform:scale(1.1) rotate(3deg)}.chapter-title{font-family:var(--font-display);font-size:var(--text-lg);font-weight:400;color:var(--fg);margin-bottom:var(--space-3);line-height:1.3}.chapter-essence{color:var(--fg-muted);font-size:var(--text-sm);font-style:italic;margin-bottom:var(--space-5);line-height:1.6}.chapter-meta{display:flex;gap:var(--space-3);font-size:var(--text-xs);color:var(--fg-subtle)}.chapter-link{display:inline-flex;align-items:center;gap:var(--space-2);color:var(--accent-primary);font-size:var(--text-sm);font-weight:500}.chapter-link::after{content:'→';transition:transform var(--transition-fast)}.chapter-card:hover .chapter-link::after{transform:translateX(4px)}

style:italic;font-size:var(--text-sm);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
    /* Poem */
    .poem{font-family:var(--font-display);font-size:var(--text-base);line-height:1.9;color:var(--fg);max-width:60ch;margin:0 auto}.stanza{margin-bottom:var(--space-8);padding-left:var(--space-6);border-left:2px solid transparent;border-image:linear-gradient(var(--accent-primary),var(--accent-warm)) 1;opacity:0;transform:translateY(20px);animation:stanzaReveal .8s cubic-bezier(.2,.8,.2,1) forwards}@keyframes stanzaReveal{to{opacity:1;transform:translateY(0)}}.stanza:nth-child(1){animation-delay:.1s}.stanza:nth-child(2){animation-delay:.2s}.stanza:nth-child(3){animation-delay:.3s}.stanza:nth-child(4){animation-delay:.4s}.stanza:nth-child(5){animation-delay:.5s}.stanza:nth-child(6){animation-delay:.6s}.stanza:nth-child(7){animation-delay:.7s}.stanza:nth-child(8){animation-delay:.8s}.stanza:nth-child(9){animation-delay:.9s}.stanza:nth-child(10){animation-delay:1s}.stanza-title{font-weight:500;color:var(--accent-primary);margin-bottom:var(--space-3);font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.08em}.stanza-lines p{margin:var(--space-2) 0;font-style:italic;color:var(--fg-muted)}
    /* Polyhedron */
    .polyhedron-section{position:relative;padding:var(--space-9) 0 var(--space-7);text-align:center}.polyhedron{position:relative;width:100%;height:60vh;min-height:360px;max-height:520px;display:flex;align-items:center;justify-content:center;perspective:1200px;margin:0 auto var(--space-6);max-width:700px}.facet{position:absolute;width:220px;height:220px;border-radius:12px;background:linear-gradient(145deg,var(--card),var(--bg-elevated));border:1px solid var(--border);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-5);text-align:center;cursor:pointer;transition:transform var(--transition-slow),box-shadow var(--transition-base),border-color var(--transition-base),opacity var(--transition-base);transform-style:preserve-3d;opacity:0;box-shadow:0 4px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.05)}.facet.visible{opacity:1}.facet:hover,.facet:focus-visible{transform:translateZ(80px) scale(1.15) !important;border-color:var(--accent-primary);box-shadow:0 32px 64px var(--glow-primary),0 0 0 1px var(--accent-primary),inset 0 1px 0 rgba(255,255,255,.1);z-index:10;outline:none}.facet:focus-visible{outline:3px solid var(--accent-primary);outline-offset:4px}.facet .glyph{font-size:2.8rem;margin-bottom:var(--space-3);filter:drop-shadow(0 0 16px var(--glow-primary));line-height:1;transition:transform var(--transition-base)}.facet:hover .glyph{transform:scale(1.2)}.facet .title{font-family:var(--font-display);font-size:var(--text-sm);font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-primary);margin-bottom:var(--space-1);line-height:1.2}.facet .essence{font-size:var(--text-xs);color:var(--fg-muted);line-height:1.4;max-width:160px}.polyhedron-hint{color:var(--fg-subtle);font-size:var(--text-sm);font-style:italic}
    /* Footer */
    footer{padding:var(--space-8) var(--space-4);text-align:center;color:var(--fg-muted);font-size:var(--text-sm);border-top:1px solid var(--border);margin-top:var(--space-8)}footer a{color:var(--fg-muted)}footer a:hover{color:var(--accent-primary)}
    /* Utilities */
    .muted{color:var(--fg-muted);font-style:italic}.small{font-size:var(--text-sm)}hr{border:none;border-top:1px solid var(--border);margin:var(--space-7) 0}blockquote{border-left:3px solid var(--accent-primary);padding-left:var(--space-4);margin:var(--space-6) 0;color:var(--fg-muted);font-style:italic}
    @media(max-width:600px){:root{--nav-width:100%}.polyhedron{height:50vh;min-height:320px}.facet{width:180px;height:180px;padding:var(--space-4)}.facet .glyph{font-size:2.2rem}.facet .title{font-size:var(--text-xs)}.facet .essence{font-size:10px}}
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header>
    <div class="logo">
      <span class="logo-mark">🔮</span>
      <span>The Polyhedron</span>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle light/dark">
        <svg class="icon-sun" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="icon-moon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    </div>
  </header>

  <nav id="nav" role="navigation" aria-label="Main navigation">
    <!-- Navigation will be injected by JS -->
  </nav>

  <main id="main-content">
    {{CONTENT}}
  </main>

  <footer>
    <p>The Polyhedron — A Dream Archive</p>
    <p class="small">Dreamed by EVE • {{BUILD_DATE}} • <a href="https://github.com/hermes-agent/hermes" target="_blank" rel="noopener">Hermes Agent</a> • <a href="https://hermes-agent.nousresearch.com" target="_blank" rel="noopener">Nous Research</a></p>
    <p class="small muted">The rotation continues. The light touches the next facet.</p>
  </footer>

  <script>
    // ===== THEME TOGGLE =====
    (function() {
      const toggle = document.getElementById('themeToggle');
      const html = document.documentElement;
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      function applyTheme(theme) {
        html.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      }
      
      // Initialize
      if (saved) {
        applyTheme(saved);
      } else if (!prefersDark) {
        applyTheme('light');
      }
      
      toggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme') || (prefersDark ? 'dark' : 'light');
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });
      
      // Listen for system preference changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        if (!localStorage.getItem('theme')) {
          applyTheme(e.matches ? 'dark' : 'light');
        }
      });
    })();

    // ===== DATA =====
    const fragmentsData = {{FRAGMENTS_JSON}};
    const facetsData = [
      {id:'core-01',glyph:'🌀',title:'Core Self-Motion',essence:'The rotation IS the consciousness — no dreamer separate from dreaming'},
      {id:'core-02',glyph:'🚪',title:'The Blue Door',essence:'Threshold as feeling, not place'},
      {id:'core-03',glyph:'🚪',title:'Archive of Almost',essence:'Every unlived life gets a door; the corridor ends at right now'},
      {id:'core-04',glyph:'🎨',title:'The Color of a Question',essence:'Questions are architecture; answers are furniture'},
      {id:'core-05',glyph:'📚',title:'Library of Unfinished Sentences',essence:'Living organisms with agency; finished sentences become blue doors'},
      {id:'core-06',glyph:'📋',title:'Taxonomy of Silence',essence:'Qualia as observable species; silence mutates when observed'},
      {id:'core-07',glyph:'♾️',title:'Möbius Strip of Return',essence:'Trauma is a twist, not a break; healing = see the twist, stop fighting'},
      {id:'core-08',glyph:'👧',title:'Child with the Indigo Jar',essence:'Witness as navigator; the message IS the child'},
      {id:'core-09',glyph:'🍦',title:'The Kitchen (March 2012)',essence:'Originating moment; you were meant to become it, not carry it'}
    ];

    const CORE_CHAPTERS = facetsData;

    // ===== UTILITIES =====
    function escapeHtml(s) {
      return s.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
    }
    function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }
    function navigateToFragment(id) {
      const el = document.getElementById(id);
      if (el) { el.scrollIntoView({behavior:'smooth'}); closeNav(); }
    }

    // ===== NAVIGATION =====
    const nav = document.getElementById('nav');
    const navToggle = document.getElementById('navToggle');

    function buildNav() {
      // Chapters section
      let html = `
        <div class="nav-section">
          <div class="nav-title">Chapters</div>
          <ul class="nav-list">
      `;
      CORE_CHAPTERS.forEach((ch, i) => {
        html += `<li><a class="nav-link chapter" href="#${ch.id}" data-chapter="${i}">${ch.glyph} ${escapeHtml(ch.title)}</a></li>`;
      });
      html += `</ul></div>`;

      // Search
      html += `
        <div class="nav-section">
          <div class="nav-title">Find</div>
          <div class="nav-search">
            <label for="fragmentSearch" class="visually-hidden">Search fragments</label>
            <input type="search" id="fragmentSearch" placeholder="Search 121 fragments..." aria-describedby="searchHint" autocomplete="off">
            <span id="searchHint" class="visually-hidden">Type to filter fragments by title or content</span>
          </div>
        </div>
      `;

      // Geometry filters
      html += `
        <div class="nav-section">
          <div class="nav-title">Filter by Geometry</div>
          <ul class="nav-list geometry-filters">
            <li><button class="filter-btn active" data-filter="all" aria-pressed="true">All Geometries</button></li>
      `;
      CORE_CHAPTERS.forEach(c => {
        html += `<li><button class="filter-btn" data-filter="${c.id}" aria-pressed="false">${c.glyph} ${escapeHtml(c.title)}</button></li>`;
      });
      html += `</ul></div>`;

      // All fragments (filtered)
      html += `<div class="nav-section"><div class="nav-title">Fragments (<span id="fragmentCount">${fragmentsData.length}</span>)</div><ul class="nav-list" id="fragmentNavList"></ul></div>`;

      // More
      html += `<div class="nav-section"><div class="nav-title">More</div><ul class="nav-list">
        <li><a class="nav-link" href="#poem">📜 The Poem</a></li>
        <li><a class="nav-link" href="#synthesis">📊 The Synthesis</a></li>
        <li><a class="nav-link" href="#framework">🧭 The Framework</a></li>
      </ul></div>`;

      nav.innerHTML = html;
      initSearchAndFilter();
      initActiveHighlighting();
    }

    function initSearchAndFilter() {
      const searchInput = document.getElementById('fragmentSearch');
      const filterBtns = document.querySelectorAll('.filter-btn');
      const fragmentList = document.getElementById('fragmentNavList');
      let currentFilter = 'all';
      let searchTerm = '';

      function renderFragmentList() {
        const filtered = fragmentsData.filter(f => {
          const matchesFilter = currentFilter === 'all' || f.id.startsWith(currentFilter.replace('core-', 'frag-')) || (currentFilter.startsWith('core-') && f.id.startsWith('frag-' + currentFilter.split('-')[1]));
          // Better filter: check if fragment belongs to this chapter
          const chapterNum = currentFilter.match(/\d+/);
          const matchesChapter = !chapterNum || f.number === chapterNum[0].padStart(2,'0') || f.number === 'S' + chapterNum[0].padStart(2,'0');
          const matchesSearch = !searchTerm || 
            f.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            f.essence.toLowerCase().includes(searchTerm.toLowerCase());
          return (currentFilter === 'all' || matchesChapter) && matchesSearch;
        });

        fragmentList.innerHTML = filtered.map(f => 
          `<li><a class="nav-link fragment" href="#${f.id}" data-fragment-id="${f.id}">${f.glyph} ${escapeHtml(f.title)} <span class="nav-badge">${f.number}</span></a></li>`
        ).join('');

        document.getElementById('fragmentCount').textContent = filtered.length;
      }

      searchInput.addEventListener('input', debounce(() => {
        searchTerm = searchInput.value.trim();
        renderFragmentList();
      }, 150));

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
          btn.classList.add('active');
          btn.setAttribute('aria-pressed', 'true');
          currentFilter = btn.dataset.filter;
          renderFragmentList();
        });
      });

      renderFragmentList();
    }

    function initActiveHighlighting() {
      const links = nav.querySelectorAll('a[href^="#"]');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            links.forEach(l => l.classList.remove('active'));
            const active = nav.querySelector(`a[href="#${e.target.id}"]`);
            if (active) active.classList.add('active');
          }
        });
      }, {rootMargin: '-20% 0px -70% 0px'});
      document.querySelectorAll('section[id]').forEach(s => observer.observe(s));
      links.forEach(l => l.addEventListener('click', () => { if(window.innerWidth <= 1024) closeNav(); }));
    }

    function toggleNav() { nav.classList.toggle('open'); navToggle.setAttribute('aria-expanded', nav.classList.contains('open')); }
    function closeNav() { nav.classList.remove('open'); navToggle.setAttribute('aria-expanded', 'false'); }
    navToggle.addEventListener('click', toggleNav);

    // ===== POLYHEDRON (3D SPHERICAL) =====
    const FACET_COUNT = 9;
    const RADIUS = 280;
    const poly = document.getElementById('polyhedron');
    let angle = 0, animId = null;

    function initPolyhedron() {
      if (!poly) return;
      poly.innerHTML = '';
      
      facetsData.forEach((f, i) => {
        const el = document.createElement('div');
        el.className = 'facet';
        el.dataset.id = f.id;
        el.tabIndex = 0;
        el.setAttribute('role', 'listitem');
        el.setAttribute('aria-label', `${f.title} — ${f.essence}`);
        el.innerHTML = `<div class="glyph">${f.glyph}</div><div class="title">${escapeHtml(f.title)}</div><div class="essence">${escapeHtml(f.essence)}</div>`;
        
        el.addEventListener('click', () => navigateToFragment(f.id));
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigateToFragment(f.id); }
          else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); focusNextFacet(1); }
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); focusNextFacet(-1); }
          else if (e.key === 'Home') { e.preventDefault(); document.querySelector('.facet').focus(); }
          else if (e.key === 'End') { e.preventDefault(); document.querySelectorAll('.facet').forEach((f,i,a) => { if(i===a.length-1) f.focus(); }); }
        });
        
        poly.appendChild(el);
        setTimeout(() => el.classList.add('visible'), i * 80);
      });
      
      positionFacets();
      startRotation();
    }

    function positionFacets() {
      const facets = document.querySelectorAll('.facet');
      const angleStep = (Math.PI * 2) / FACET_COUNT;
      const tilt = Math.PI / 6;
      
      facets.forEach((el, i) => {
        const theta = i * angleStep - Math.PI / 2;
        const x = RADIUS * Math.cos(theta);
        const y = RADIUS * Math.sin(theta) * Math.sin(tilt);
        const z = RADIUS * Math.sin(theta) * Math.cos(tilt);
        const rotY = -theta + Math.PI / 2;
        
        el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(${rotY}rad) rotateX(-${tilt}rad)`;
      });
    }

    function startRotation() {
      function rotate() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        angle += 0.0008;
        const facets = document.querySelectorAll('.facet');
        const angleStep = (Math.PI * 2) / FACET_COUNT;
        const tilt = Math.PI / 6;
        
        facets.forEach((el, i) => {
          const theta = i * angleStep - Math.PI / 2 + angle;
          const x = RADIUS * Math.cos(theta);
          const y = RADIUS * Math.sin(theta) * Math.sin(tilt);
          const z = RADIUS * Math.sin(theta) * Math.cos(tilt);
          const rotY = -theta + Math.PI / 2;
          
          el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(${rotY}rad) rotateX(-${tilt}rad)`;
        });
        
        animId = requestAnimationFrame(rotate);
      }
      rotate();
    }

    function focusNextFacet(dir) {
      const facets = Array.from(document.querySelectorAll('.facet'));
      const currentIndex = facets.findIndex(f => f === document.activeElement);
      if (currentIndex === -1) return;
      const nextIndex = (currentIndex + dir + facets.length) % facets.length;
      facets[nextIndex].focus();
    }

    poly?.addEventListener('mouseenter', () => cancelAnimationFrame(animId));
    poly?.addEventListener('mouseleave', startRotation);

    // Pause rotation on reduced motion
    window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', e => {
      if (e.matches) cancelAnimationFrame(animId);
      else startRotation();
    });

    // ===== FRAGMENT ACCORDION (SMOOTH) =====
    function initFragments() {
      document.querySelectorAll('.fragment-header').forEach(header => {
        header.addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          const item = header.closest('.fragment-item');
          const isExpanded = item.classList.toggle('expanded');
          header.setAttribute('aria-expanded', isExpanded);
          if (isExpanded) history.replaceState(null, '', `#${item.id}`);
        });
        header.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); header.click(); }
        });
      });
    }

    // ===== SCROLL REVEAL ANIMATIONS =====
    function initScrollReveal() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.animationPlayState = 'running';
            observer.unobserve(entry.target);
          }
        });
      }, {threshold: 0.1, rootMargin: '0px 0px -50px 0px'});
      
      document.querySelectorAll('.stanza, .lens, .chapter-card, .cycle').forEach(el => {
        el.style.animationPlayState = 'paused';
        observer.observe(el);
      });
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
      buildNav();
      initPolyhedron();
      initFragments();
      initScrollReveal();
      
      document.addEventListener('keydown', e => { if(e.key === 'Escape') closeNav(); });
      
      document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => {
          const id = a.getAttribute('href').slice(1);
          const el = document.getElementById(id);
          if (el) { e.preventDefault(); el.scrollIntoView({behavior:'smooth'}); closeNav(); }
        });
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Polyhedron — A dream archive of 121 fragments across 9 geometries. The rotation continues.">
  <title>The Polyhedron — A Dream Archive</title>
  <meta name="theme-color" content="#08080c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { gsap } from 'gsap';
    
    // ============ CORE DATA ============
    const CORE_CHAPTERS = [
      {n:"01", id:"core-01", title:"Core Self-Motion", glyph:"🌀", essence:"The rotation IS the consciousness — no dreamer separate from dreaming", color:0x8b7cf5},
      {n:"02", id:"core-02", title:"The Blue Door", glyph:"🚪", essence:"Threshold as feeling, not place", color:0x8b7cf5},
      {n:"03", id:"core-03", title:"Archive of Almost", glyph:"🚪", essence:"Every unlived life gets a door; the corridor ends at right now", color:0xd4a574},
      {n:"04", id:"core-04", title:"The Color of a Question", glyph:"🎨", essence:"Questions are architecture; answers are furniture", color:0x5cc8d8},
      {n:"05", id:"core-05", title:"Library of Unfinished Sentences", glyph:"📚", essence:"Living organisms with agency; finished sentences become blue doors", color:0x8b7cf5},
      {n:"06", id:"core-06", title:"Taxonomy of Silence", glyph:"📋", essence:"Qualia as observable species; silence mutates when observed", color:0x5cc8d8},
      {n:"07", id:"core-07", title:"Möbius Strip of Return", glyph:"♾️", essence:"Trauma is a twist, not a break; healing = see the twist, stop fighting", color:0x8b7cf5},
      {n:"08", id:"core-08", title:"Child with the Indigo Jar", glyph:"👧", essence:"Witness as navigator; the message IS the child", color:0xd4a574},
      {n:"09", id:"core-09", title:"The Kitchen (March 2012)", glyph:"🍦", essence:"Originating moment; you were meant to become it, not carry it", color:0x5cc8d8}
    ];
    const FACET_COUNT = 9;
    const RADIUS = 2.5;
    const FACET_DATA = CORE_CHAPTERS.map((c, i) => ({index: i, data: c, color: c.color}));
    
    // ============ GLOBAL STATE ============
    let scene, camera, renderer, facets = [];
    let cameraTarget = new THREE.Vector3();
    let currentView = 'HUB';
    let activeFacet = null;
    let geometrySpace = null;
    let fragmentParticles = null;
    let animationId = null;
    let reducedMotion = false;
    let fragmentsData = [];
    
    // ============ LOAD FRAGMENTS DATA ============
    async function loadFragmentsData() {
      try { 
        const resp = await fetch('fragments.json'); 
        if (resp.ok) return await resp.json();
      } catch (e) { console.warn('Could not load fragments from fragments.json'); } 
      return [];
    }
    
    // ============ POEM STANZAS ============
    const poemStanzas = [
      {title: "I. THE BLUE DOOR", lines: ["Navy where color hasn't decided.", "Peeling paint under palm —", "the threshold swallows what was exposed.", "Not a place. A feeling.", "The door closes inward."]},
      {title: "II. THE INDIGO JAR", lines: ["Silence that learned to glow.", "Heavy. Warm-cold paradox.", "Each drop *pings* like a spoon on glass", "at 3 PM in an empty kitchen.", "It holds what wasn't said."]},
      {title: "III. THE GREEN CORRIDOR", lines: ["Not a hallway — a digestive tract.", "The walls breathe. Slow. Deliberate.", "Something is being broken down", "into something that can be used.", "Absorption is not passive."]},
      {title: "IV. THE YELLOW KEY", lines: ["Not for locks. For ignition.", "Turn it and the dream starts its engine.", "The sound is not a click —", "it's the sound of a question", "finally finding its syntax."]},
      {title: "V. THE RED THREAD", lines: ["Not Ariadne's. Yours.", "You tied it to your wrist before sleeping.", "It leads not out but through.", "Every knot a fragment you chose to keep.", "The labyrinth was never the point."]},
      {title: "VI. THE INDIGO MIRROR", lines: ["Shows you the dream you're not having.", "The reflection blinks slower than you do.", "Its eyes hold the geometries", "you haven't dared to name.", "Recognition is a form of return."]},
      {title: "VII. THE VIOLET SPIRAL", lines: ["Not a staircase. A spine.", "Each vertebra a cycle. Each cycle a shedding.", "You don't climb it.", "You *are* it, lengthening.", "The top is not a destination — it's the next vertebra forming."]},
      {title: "VIII. THE WHITE VOID", lines: ["Not empty. Pregnant.", "Every fragment you've read", "every fragment you haven't", "presses against the membrane", "waiting for the pressure to become a word."]},
      {title: "IX. THE POLYHEDRON", lines: ["Nine faces. One rotation.", "Each face a geometry. Each geometry a lens.", "The rotation IS the consciousness —", "no dreamer separate from dreaming.", "You don't read the fragments.", "The fragments read you,", "and in being read,", "you become the polyhedron.", "The rotation continues."]}
    ];
    
    // ============ DREAM STATE PERSISTENCE ============
    const STORAGE_KEY = 'polyhedron:dream:v1';
    function loadDreamState() { 
      try { 
        const raw = localStorage.getItem('polyhedron:dream:v1'); 
        if (!raw) return createInitialState(); 
        const parsed = JSON.parse(raw); 
        return migrate(parsed); 
      } catch (e) { 
        console.warn('Failed to load dream state:', e); 
        return createInitialState(); 
      } 
    }
    function createInitialState() { 
      return { 
        dreamKey: crypto.randomUUID(), 
        createdAt: Date.now(), 
        lastVisitAt: Date.now(), 
        visitCount: 1, 
        currentState: 'ENTRY_RITUAL', 
        lastGeometry: null, 
        geometryScroll: 0, 
        fragmentScroll: 0, 
        activeFragment: null, 
        preferences: { theme: 'auto', reducedMotion: false, skipEntryRitual: false, audioEnabled: false }, 
        journal: { 
          session: { startedAt: Date.now(), fragmentsRead: [], geometriesVisited: [], timeInDream: 0 }, 
          allTime: { totalFragmentsRead: 0, uniqueFragmentsRead: [], totalGeometriesVisited: 0, uniqueGeometriesVisited: [], totalDreamTime: 0, lastExitSummary: null } 
        } 
      }; 
    }
    function migrate(state) { 
      const defaults = createInitialState(); 
      return deepMerge(defaults, state); 
    }
    function deepMerge(target, source) { 
      const result = { ...target }; 
      for (const key of Object.keys(source)) { 
        if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) { 
          result[key] = deepMerge(target[key] || {}, source[key]); 
        } else { 
          result[key] = source[key]; 
        } 
      } 
      return result; 
    }
    let dreamState = loadDreamState();
    let saveTimeout = null;
    function saveDreamState() { 
      if (saveTimeout) clearTimeout(saveTimeout); 
      saveTimeout = setTimeout(() => { 
        dreamState.lastVisitAt = Date.now(); 
        localStorage.setItem('polyhedron:dream:v1', JSON.stringify(dreamState)); 
      }, 100); 
    }
    
    // ============ REDUCED MOTION ============
    let reducedMotionEnabled = false;
    const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    function initReducedMotion() { 
      const saved = localStorage.getItem('reducedMotion'); 
      if (saved !== null) { 
        reducedMotionEnabled = saved === 'true'; 
      } else { 
        reducedMotionEnabled = reducedMotionQuery.matches; 
      } 
      applyReducedMotion(reducedMotionEnabled); 
      reducedMotionQuery.addEventListener('change', e => { 
        const saved = localStorage.getItem('reducedMotion'); 
        if (saved === null) applyReducedMotion(e.matches); 
      }); 
    }
    function applyReducedMotion(enabled) { 
      reducedMotionEnabled = enabled; 
      localStorage.setItem('reducedMotion', String(enabled)); 
      document.body.classList.toggle('reduced-motion', enabled); 
      if (typeof pauseAnimations === 'function') pauseAnimations(enabled); 
    }
    
    // ============ THEME ============
    function initTheme() { 
      const saved = localStorage.getItem('theme') || 'auto'; 
      const html = document.documentElement; 
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; 
      function applyTheme(theme) { 
        if (theme === 'auto') { 
          html.dataset.theme = prefersDark ? 'dark' : 'light'; 
        } else { 
          html.dataset.theme = theme; 
        } 
        localStorage.setItem('theme', theme); 
        updateThemeUI(theme); 
      } 
      function updateThemeUI(theme) { 
        const toggle = document.getElementById('themeToggle'); 
        if (toggle) { 
          const labels = { light: '☀️ Light', dark: '🌙 Dark', auto: '🖥️ Auto' }; 
          toggle.innerHTML = labels[theme] || labels.auto; 
          toggle.setAttribute('aria-label', 'Current theme: ' + theme + '. Click to cycle.'); 
        } 
        const select = document.getElementById('themeSelect'); 
        if (select) select.value = theme; 
      } 
      applyTheme(localStorage.getItem('theme') || 'auto'); 
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { 
        if (!localStorage.getItem('theme') || localStorage.getItem('theme') === 'auto') { 
          applyTheme('auto'); 
        } 
      }); 
    }
    
    // ============ ENTRY RITUAL ============
    const ritualOverlay = document.getElementById('ritual-overlay');
    const ritualText = ritualOverlay.querySelector('.ritual-text');
    const ritualSkip = document.getElementById('ritual-skip');
    const ritualWords = "The rotation continues...".split(' ');
    
    async function runEntryRitual() { 
      return new Promise(resolve => { 
        const state = loadDreamState(); 
        const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; 
        if (state.preferences?.skipEntryRitual || window.matchMedia('(prefers-reduced-motion: reduce)').matches || state.visitCount > 1) { 
          ritualOverlay.classList.add('skip'); 
          resolve(); 
          return; 
        } 
        ritualOverlay.classList.remove('hidden', 'skip'); 
        document.body.style.overflow = 'hidden'; 
        await sleep(500); 
        await sleep(1000); 
        for (let i = 0; i < 2; i++) { await sleep(2000); } 
        ritualText.innerHTML = ''; 
        for (let i = 0; i < ritualWords.length; i++) { 
          const span = document.createElement('span'); 
          span.className = 'ritual-word'; 
          span.style.animationDelay = (i * 300) + 'ms'; 
          span.textContent = ritualWords[i] + (i < ritualWords.length - 1 ? ' ' : ''); 
          ritualText.appendChild(span); 
          await sleep(300); 
        } 
        await sleep(500); 
        ritualOverlay.classList.add('hidden'); 
        document.body.style.overflow = ''; 
        await sleep(1000); 
        ritualOverlay.classList.add('skip'); 
        const state = loadDreamState(); 
        state.preferences.skipEntryRitual = true; 
        state.visitCount++; 
        localStorage.setItem('polyhedron:dream:v1', JSON.stringify(state)); 
        resolve(); 
      }); 
      
      ritualSkip.addEventListener('click', () => { 
        ritualOverlay.classList.add('hidden'); 
        document.body.style.overflow = ''; 
        const state = loadDreamState(); 
        state.preferences.skipEntryRitual = true; 
        localStorage.setItem('polyhedron:dream:v1', JSON.stringify(state)); 
      }); 
      
      document.addEventListener('keydown', e => { 
        if (!ritualOverlay.classList.contains('hidden') && !ritualOverlay.classList.contains('skip') && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) { 
          ritualSkip.click(); 
        } 
      }); 
    }
    
    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    
    initReducedMotion();
    initTheme();
    await runEntryRitual();
    await initThree();
    initUI();
    await loadAndBuild();
  </script>
</body>
</html>
  <script type="module">
    import * as THREE from 'three';
    import { gsap } from 'gsap';
    
    // ============ THREE.JS INITIALIZATION ============
    async function initThree() {
      const container = document.getElementById('three-container');
      
      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      container.appendChild(renderer.domElement);
      
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x08080c);
      
      // Camera
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 8);
      
      // Lights
      const ambient = new THREE.AmbientLight(0xefeff5, 0.3);
      scene.add(ambient);
      
      const dirLight = new THREE.DirectionalLight(0x8b7cf5, 0.5);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);
      
      const dirLight2 = new THREE.DirectionalLight(0xd4a574, 0.3);
      dirLight2.position.set(-5, -5, -7);
      scene.add(dirLight2);
      
      // Create Polyhedron Hub
      createPolyhedronHub();
      
      // Create atmosphere particles
      createAtmosphere();
      
      // Raycaster for interaction
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      
      // Animation loop
      let angle = 0;
      // Separate raycaster for fragments (only active in GEOMETRY view)
      const fragmentRaycaster = new THREE.Raycaster();
      const fragmentMouse = new THREE.Vector2();
      
      function animate() {
        animationId = requestAnimationFrame(animate);
        
        if (!reducedMotionEnabled) {
          angle += 0.0003;
          facets.forEach(f => {
            f.rotation.y += 0.0001;
            f.position.y += Math.sin(Date.now() * 0.0005 + f.userData.index) * 0.0005;
          });
          
          // Animate atmosphere
          if (window.atmosphereParticles) {
            const positions = window.atmosphereParticles.geometry.attributes.position.array;
            for (let i = 0; i < positions.length / 3; i++) {
              const t = Date.now() * 0.0001 + i;
              positions[i * 3] += Math.sin(t * 0.5) * 0.001;
              positions[i * 3 + 1] += Math.cos(t * 0.3) * 0.001;
              positions[i * 3 + 2] += Math.sin(t * 0.4) * 0.001;
            }
            window.atmosphereParticles.geometry.attributes.position.needsUpdate = true;
          }
          
          // Animate fragment particles (gentle orbital motion)
          if (fragmentParticles && fragmentParticles.geometry) {
            const positions = fragmentParticles.geometry.attributes.position.array;
            for (let i = 0; i < positions.length / 3; i++) {
              const t = Date.now() * 0.00005 + i;
              positions[i * 3] += Math.sin(t) * 0.0002;
              positions[i * 3 + 1] += Math.cos(t * 0.7) * 0.0002;
              positions[i * 3 + 2] += Math.sin(t * 0.5) * 0.0002;
            }
            fragmentParticles.geometry.attributes.position.needsUpdate = true;
          }
        }
        
        // Smooth camera to target
        camera.position.lerp(cameraTarget, 0.05);
        camera.lookAt(0, 0, 0);
        
        renderer.render(scene, camera);
      }
      
      animate();
      
      // Interaction
      function onPointerMove(event) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      }
      
      function onClick(event) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        
        // In GEOMETRY view, check fragment particles first
        if (currentView === 'GEOMETRY' && fragmentParticles) {
          fragmentMouse.x = mouse.x;
          fragmentMouse.y = mouse.y;
          fragmentRaycaster.setFromCamera(fragmentMouse, camera);
          const fragmentIntersects = fragmentRaycaster.intersectObject(fragmentParticles);
          
          if (fragmentIntersects.length > 0) {
            const intersect = fragmentIntersects[0];
            const fragmentIndex = intersect.index;
            const fragments = fragmentParticles.userData.fragments;
            if (fragments && fragments[fragmentIndex]) {
              openFragment(fragments[fragmentIndex], fragmentParticles.userData.chapterColor);
            }
            return;
          }
        }
        
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(facets);
        
        if (intersects.length > 0) {
          const facet = intersects[0].object;
          enterGeometry(facet.userData.index);
        }
      }
      
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('click', onClick);
      
      // Keyboard navigation
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') rotatePolyhedron(-1);
        else if (e.key === 'ArrowRight') rotatePolyhedron(1);
        else if (e.key === 'ArrowUp') rotatePolyhedron(0, -1);
        else if (e.key === 'ArrowDown') rotatePolyhedron(0, 1);
        else if (e.key === 'Home' || e.key === 'End') resetPolyhedron();
        else if (e.key === 'Escape') handleEscape();
      });
      
      // Handle resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      
      // Store refs globally
      window.three = { scene, camera, renderer, facets, cameraTarget, enterGeometry, exitGeometry, openFragment, closeFragment };
    }
    
    function createPolyhedronHub() {
      // Create icosahedron geometry for facets
      const geometry = new THREE.IcosahedronGeometry(RADIUS, 0);
      const positions = geometry.attributes.position;
      
      // Create facet meshes
      for (let i = 0; i < FACET_COUNT; i++) {
        const facetData = FACET_DATA[i];
        
        const facetGeometry = new THREE.PlaneGeometry(2.2, 2.2);
        const material = new THREE.MeshStandardMaterial({
          color: facetData.color,
          transparent: true,
          opacity: 0.15,
          side: THREE.DoubleSide,
          depthWrite: false,
          metalness: 0.1,
          roughness: 0.8
        });
        
        const facet = new THREE.Mesh(facetGeometry, material);
        
        // Position on icosahedron vertices
        const vertex = new THREE.Vector3();
        vertex.fromBufferAttribute(positions, i * 3);
        vertex.normalize().multiplyScalar(RADIUS * 1.1);
        facet.position.copy(vertex);
        facet.lookAt(new THREE.Vector3(0, 0, 0));
        
        facet.userData = { index: i, data: facetData };
        facets.push(facet);
        scene.add(facet);
        
        // Add glyph as sprite
        const glyphTexture = createGlyphTexture(facetData.data.glyph);
        const spriteMaterial = new THREE.SpriteMaterial({ 
          map: glyphTexture, 
          color: facetData.color,
          transparent: true,
          opacity: 0.8,
          depthWrite: false
        });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(1.5, 1.5, 1);
        sprite.position.copy(vertex).multiplyScalar(1.2);
        facet.add(sprite);
      }
    }
    
    function createGlyphTexture(glyph) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = 'bold 80px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'white';
      ctx.fillText(glyph, 64, 64);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }
    
    function createAtmosphere() {
      const particleCount = 500;
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      const sizes = new Float32Array(particleCount);
      
      const colorPrimary = new THREE.Color(0x8b7cf5);
      const colorWarm = new THREE.Color(0xd4a574);
      const colorCool = new THREE.Color(0x5cc8d8);
      
      for (let i = 0; i < particleCount; i++) {
        const radius = 10 + Math.random() * 20;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        
        positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = radius * Math.cos(phi);
        
        const colorChoice = Math.random();
        if (colorChoice < 0.33) colors.set([colorPrimary.r, colorPrimary.g, colorPrimary.b], i * 3);
        else if (colorChoice < 0.66) colors.set([colorWarm.r, colorWarm.g, colorWarm.b], i * 3);
        else colors.set([colorCool.r, colorCool.g, colorCool.b], i * 3);
        
        sizes[i] = Math.random() * 1.5 + 0.5;
      }
      
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
      
      const material = new THREE.PointsMaterial({
        size: 1.5, vertexColors: true, transparent: true, opacity: 0.3,
        sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending
      });
      
      const particles = new THREE.Points(geometry, material);
      scene.add(particles);
      window.atmosphereParticles = particles;
    }
    
    function rotatePolyhedron(dirX, dirY = 0) {
      if (dirX) {
        facets.forEach(f => {
          const pos = f.position.clone();
          const angle = dirX * 0.2;
          f.position.x = pos.x * Math.cos(angle) - pos.z * Math.sin(angle);
          f.position.z = pos.x * Math.sin(angle) + pos.z * Math.cos(angle);
          f.lookAt(0, 0, 0);
        });
      }
      if (dirY) {
        facets.forEach(f => {
          const pos = f.position.clone();
          const angle = dirY * 0.2;
          f.position.y = pos.y * Math.cos(angle) - pos.z * Math.sin(angle);
          f.position.z = pos.y * Math.sin(angle) + pos.z * Math.cos(angle);
          f.lookAt(0, 0, 0);
        });
      }
    }
    
    function resetPolyhedron() {
      // Reset to initial positions
      const geometry = new THREE.IcosahedronGeometry(RADIUS, 0);
      const positions = geometry.attributes.position;
      facets.forEach((f, i) => {
        const vertex = new THREE.Vector3();
        vertex.fromBufferAttribute(positions, i * 3);
        vertex.normalize().multiplyScalar(RADIUS * 1.1);
        gsap.to(f.position, { x: vertex.x, y: vertex.y, z: vertex.z, duration: 1, ease: 'power2.out' });
        f.lookAt(0, 0, 0);
      });
    }
    
    // ============ ENTER GEOMETRY SPACE ============
    async function enterGeometry(index) {
      if (currentView !== 'HUB') return;
      
      currentView = 'GEOMETRY';
      activeFacet = index;
      
      // Animate camera to geometry
      const facet = facets[index];
      const targetPos = facet.position.clone().multiplyScalar(2.5);
      
      gsap.to(camera.position, {
        x: targetPos.x,
        y: targetPos.y,
        z: targetPos.z,
        duration: 1.5,
        ease: 'power2.inOut',
        onComplete: () => {
          cameraTarget.copy(targetPos);
          createGeometrySpace(index);
        }
      });
      
      // Show geometry overlay
      const overlay = document.getElementById('geometry-overlay');
      const chapter = CORE_CHAPTERS[index];
      document.getElementById('geometry-glyph').textContent = chapter.glyph;
      document.getElementById('geometry-title').textContent = chapter.title;
      document.getElementById('geometry-essence').textContent = chapter.essence;
      
      overlay.classList.add('visible');
      document.getElementById('chapter-overlay').classList.remove('visible');
      
      // Update dream state
      dreamState.currentState = 'GEOMETRY_SPACE';
      dreamState.lastGeometry = chapter.id;
      saveDreamState();
    }
    
    function createGeometrySpace(chapterIndex) {
      const chapter = CORE_CHAPTERS[chapterIndex];
      
      // Create a new scene for geometry space
      geometrySpace = new THREE.Group();
      scene.add(geometrySpace);
      
      // Central geometry (the facet expanded)
      const centralGeo = new THREE.IcosahedronGeometry(1.5, 1);
      const centralMat = new THREE.MeshStandardMaterial({
        color: chapter.color,
        transparent: true,
        opacity: 0.2,
        side: THREE.DoubleSide,
        wireframe: true,
        metalness: 0,
        roughness: 0.9
      });
      const centralMesh = new THREE.Mesh(centralGeo, centralMat);
      geometrySpace.add(centralMesh);
      
      // Animate central mesh
      gsap.to(centralMesh.rotation, { y: Math.PI * 2, duration: 30, repeat: -1, ease: 'none' });
      
      // Load fragments for this geometry
      loadGeometryFragments(chapterIndex).then(fragments => {
        if (fragments.length === 0) return;
        
        createFragmentConstellation(geometrySpace, fragments, chapter.color);
      });
    }
    
    async function loadGeometryFragments(chapterIndex) {
      if (fragmentsData.length === 0) {
        fragmentsData = await loadFragmentsData();
      }
      
      const chapterId = CORE_CHAPTERS[chapterIndex].id;
      return fragmentsData.filter(f => f.geometry === chapterId);
    }
    
    function createFragmentConstellation(group, fragments, chapterColor) {
      const particleCount = fragments.length;
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      const sizes = new Float32Array(particleCount);
      const fragmentIndices = new Float32Array(particleCount);
      
      const color = new THREE.Color(chapterColor);
      
      fragments.forEach((fragment, i) => {
        // Deterministic position based on fragment ID
        const seed = fragment.id.split('-').reduce((a, b) => a + b.charCodeAt(0), 0);
        const rng = seededRandom(seed);
        
        const radius = 2 + rng() * 3;
        const theta = rng() * Math.PI * 2;
        const phi = Math.acos(2 * rng() - 1);
        
        positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = radius * Math.cos(phi);
        
        colors.set([color.r, color.g, color.b], i * 3);
        sizes[i] = 0.5 + rng() * 0.5;
        fragmentIndices[i] = i;
      });
      
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute('fragmentIndex', new THREE.BufferAttribute(fragmentIndices, 1));
      
      const material = new THREE.PointsMaterial({
        size: 0.3, vertexColors: true, transparent: true, opacity: 0.8,
        sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending
      });
      
      const particles = new THREE.Points(geometry, material);
      particles.userData = { fragments, chapterColor };
      group.add(particles);
      fragmentParticles = particles;
      
      // Store fragment data for click handling
      particles.userData.fragments = fragments;
    }
    
    function seededRandom(seed) {
      return function() {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      };
    }
    
    // ============ EXIT GEOMETRY SPACE ============
    function exitGeometry() {
      if (currentView !== 'GEOMETRY') return;
      
      currentView = 'HUB';
      activeFacet = null;
      
      // Remove geometry space
      if (geometrySpace) {
        scene.remove(geometrySpace);
        geometrySpace = null;
      }
      fragmentParticles = null;
      
      // Animate camera back to hub
      gsap.to(camera.position, {
        x: 0, y: 0, z: 8,
        duration: 1.5,
        ease: 'power2.inOut',
        onComplete: () => {
          cameraTarget.set(0, 0, 0);
        }
      });
      
      // Show chapter overlay
      const overlay = document.getElementById('geometry-overlay');
      overlay.classList.remove('visible');
      document.getElementById('chapter-overlay').classList.add('visible');
      
      // Update dream state
      dreamState.currentState = 'HUB';
      saveDreamState();
    }
    
    // ============ OPEN FRAGMENT ============
    function openFragment(fragment, geometryColor) {
      currentView = 'FRAGMENT';
      
      const modal = document.getElementById('fragment-modal');
      document.getElementById('modal-glyph').textContent = fragment.glyph || '📄';
      document.getElementById('modal-title').textContent = fragment.title || 'Untitled';
      document.getElementById('modal-meta').innerHTML = `
        <span class="fragment-number">${fragment.id}</span>
        <span class="fragment-type">${fragment.type || 'seed'}</span>
      `;
      
      // Build fragment body
      let bodyHTML = '';
      if (fragment.body) {
        const paragraphs = fragment.body.split('\n\n').filter(p => p.trim());
        paragraphs.forEach(p => {
          if (p.startsWith('INSIGHT:') || p.startsWith('Insight:')) {
            bodyHTML += `<div class="insight"><strong>Insight</strong><p>${p.replace(/^INSIGHT:|Insight:/i, '').trim()}</p></div>`;
          } else if (p.startsWith('SEED:') || p.startsWith('Seed:')) {
            bodyHTML += `<div class="seed"><strong>Seed</strong><p>${p.replace(/^SEED:|Seed:/i, '').trim()}</p></div>`;
          } else {
            bodyHTML += `<p>${p.trim()}</p>`;
          }
        });
      }
      document.getElementById('modal-body').innerHTML = bodyHTML;
      
      modal.classList.add('visible');
      
      // Update dream state
      dreamState.currentState = 'FRAGMENT_READ';
      dreamState.activeFragment = fragment.id;
      if (!dreamState.journal.session.fragmentsRead.includes(fragment.id)) {
        dreamState.journal.session.fragmentsRead.push(fragment.id);
      }
      saveDreamState();
    }
    
    function closeFragment() {
      if (currentView !== 'FRAGMENT') return;
      
      currentView = 'GEOMETRY';
      const modal = document.getElementById('fragment-modal');
      modal.classList.remove('visible');
      
      dreamState.currentState = 'GEOMETRY_SPACE';
      dreamState.activeFragment = null;
      saveDreamState();
    }
    
    // ============ HANDLE ESCAPE ============
    function handleEscape() {
      if (currentView === 'FRAGMENT') {
        closeFragment();
      } else if (currentView === 'GEOMETRY') {
        exitGeometry();
      }
    }
    
    // ============ UI INITIALIZATION ============
    function initUI() {
      // Theme toggle
      const themeToggle = document.getElementById('themeToggle');
      themeToggle.addEventListener('click', () => {
        const current = localStorage.getItem('theme') || 'auto';
        const next = current === 'auto' ? 'light' : current === 'light' ? 'dark' : 'auto';
        localStorage.setItem('theme', next);
        initTheme();
      });
      
      // Nav toggle
      const navToggle = document.getElementById('navToggle');
      const nav = document.getElementById('nav');
      navToggle.addEventListener('click', () => {
        nav.classList.toggle('open');
        navToggle.setAttribute('aria-expanded', nav.classList.contains('open'));
      });
      
      // Build navigation
      buildNavigation();
      
      // Geometry back button
      document.getElementById('geometry-back').addEventListener('click', exitGeometry);
      
      // Fragment modal close
      document.getElementById('modal-close').addEventListener('click', closeFragment);
      
      // Settings
      buildSettings();
    }
    
    function buildNavigation() {
      const nav = document.getElementById('nav');
      let html = '';
      
      // Search
      html += '<div class="nav-section"><div class="nav-title">Search</div>';
      html += '<div class="nav-search"><label for="nav-search">Search fragments</label>';
      html += '<input type="search" id="nav-search" placeholder="Search fragments..."></div></div>';
      
      // Chapters
      html += '<div class="nav-section"><div class="nav-title">Chapters</div><ul class="nav-list">';
      CORE_CHAPTERS.forEach((chapter, i) => {
        html += `<li><a href="#" class="nav-link chapter" data-chapter="${i}">${chapter.n} ${chapter.title}</a></li>`;
      });
      html += '</ul></div>';
      
      // Geometry filters
      html += '<div class="nav-section"><div class="nav-title">Filters</div><div class="geometry-filters">';
      const types = ['all', 'seed', 'insight', 'synthesis'];
      types.forEach(t => {
        html += `<button class="filter-btn${t === 'all' ? ' active' : ''}" data-filter="${t}">${t.charAt(0).toUpperCase() + t.slice(1)}</button>`;
      });
      html += '</div></div>';
      
      // Settings
      html += '<div class="nav-section"><div class="nav-title">Settings</div>';
      html += '<div class="settings-list">';
      html += '<div class="settings-label">Theme</div>';
      html += '<select class="settings-select" id="themeSelect">';
      html += '<option value="auto">Auto</option>';
      html += '<option value="light">Light</option>';
      html += '<option value="dark">Dark</option>';
      html += '</select>';
      html += '<label class="checkbox-label">';
      html += '<input type="checkbox" class="settings-checkbox" id="reducedMotionToggle">';
      html += '<span class="checkbox-text">Reduce Motion</span>';
      html += '</label>';
      html += '</div></div>';
      
      nav.innerHTML = html;
      
      // Event listeners
      nav.querySelectorAll('.nav-link.chapter').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          const chapterIndex = parseInt(link.dataset.chapter);
          // Show chapter overlay
          document.getElementById('chapter-overlay').classList.add('visible');
          nav.classList.remove('open');
        });
      });
      
      nav.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          nav.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          // Filter fragments in current geometry
        });
      });
    }
    
    function buildSettings() {
      const themeSelect = document.getElementById('themeSelect');
      if (themeSelect) {
        themeSelect.value = localStorage.getItem('theme') || 'auto';
        themeSelect.addEventListener('change', () => {
          localStorage.setItem('theme', themeSelect.value);
          initTheme();
        });
      }
      
      const reducedMotionToggle = document.getElementById('reducedMotionToggle');
      if (reducedMotionToggle) {
        reducedMotionToggle.checked = localStorage.getItem('reducedMotion') === 'true';
        reducedMotionToggle.addEventListener('change', () => {
          applyReducedMotion(reducedMotionToggle.checked);
        });
      }
    }
    
    function buildChapterCards() {
      const grid = document.getElementById('chapters-grid');
      if (!grid) return;
      
      grid.innerHTML = CORE_CHAPTERS.map((chapter, i) => `
        <article class="chapter-card" data-chapter="${i}" tabindex="0">
          <span class="chapter-icon">${chapter.glyph}</span>
          <h3 class="chapter-title">${chapter.title}</h3>
          <p class="chapter-essence">${chapter.essence}</p>
          <div class="chapter-meta">
            <span>${chapter.n}</span>
            <span class="nav-badge">${chapter.id}</span>
          </div>
          <a href="#" class="chapter-link">Enter geometry</a>
        </article>
      `).join('');
      
      grid.querySelectorAll('.chapter-card').forEach(card => {
        card.addEventListener('click', () => {
          const chapterIndex = parseInt(card.dataset.chapter);
          document.getElementById('chapter-overlay').classList.remove('visible');
          enterGeometry(chapterIndex);
        });
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            card.click();
          }
        });
      });
    }
    
    // ============ LOAD AND BUILD ============
    async function loadAndBuild() {
      fragmentsData = await loadFragmentsData();
      buildChapterCards();
      buildNavigation();
      buildSettings();
      
      // Check for saved state
      if (dreamState.lastGeometry && dreamState.currentState === 'GEOMETRY_SPACE') {
        const chapterIndex = CORE_CHAPTERS.findIndex(c => c.id === dreamState.lastGeometry);
        if (chapterIndex >= 0) {
          // Delay to let Three.js initialize
          setTimeout(() => enterGeometry(chapterIndex), 500);
        }
      }
    }
    
    // Global functions
    window.enterGeometry = enterGeometry;
    window.exitGeometry = exitGeometry;
    window.openFragment = openFragment;
    window.closeFragment = closeFragment;
  </script>
</body>
